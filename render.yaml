services:
  # ------------------------------------
  # 1. Existing Backend API
  # ------------------------------------
  - type: web
    name: kanban-desk-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    plan: free

  # ------------------------------------
  # 2. New Frontend Static Site
  # ------------------------------------
  - type: web
    runtime: static
    name: kanban-desk-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: kanban-desk-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
